<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="ブラウザで遊べるネオン剣戟2Dアクションゲーム">
  <title>NEON RONIN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">CYBER SWORD ACTION</p>
        <h1>NEON <span>RONIN</span></h1>
      </div>
      <div class="controls-hint"><b>移動</b> WASD / 矢印　<b>攻撃</b> J / Space　<b>ダッシュ</b> K / Shift</div>
    </header>

    <section class="stage" aria-label="NEON RONIN ゲーム画面">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="startPanel" class="panel">
        <p class="kicker">THE CITY NEVER SLEEPS</p>
        <h2>夜明けまで、生き残れ。</h2>
        <p>敵の攻撃をかいくぐり、刃とダッシュでウェーブを突破せよ。</p>
        <button id="startButton">ゲームスタート</button>
      </div>
      <div class="touch-controls" aria-label="タッチ操作">
        <div class="dpad">
          <button data-key="up" aria-label="上">▲</button>
          <button data-key="left" aria-label="左">◀</button>
          <button data-key="down" aria-label="下">▼</button>
          <button data-key="right" aria-label="右">▶</button>
        </div>
        <div class="actions">
          <button class="dash" data-key="dash">DASH</button>
          <button class="attack" data-key="attack">斬</button>
        </div>
      </div>
    </section>

    <footer>
      <span>敵を連続で倒すとコンボ倍率アップ</span>
      <span>© 2026 NEON RONIN</span>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
